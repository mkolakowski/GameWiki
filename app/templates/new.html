{% extends "base.html" %}
{% block title %}New page &mdash; GameWiki{% endblock %}

{% block content %}
  <h1>New page</h1>

  {% if error %}
    <p class="banner">{{ error }}</p>
  {% endif %}

  <form method="post" action="/new">
    <div class="field">
      <label for="slug">Slug</label>
      <input id="slug" name="slug" value="{{ slug }}" maxlength="200"
             pattern="[a-z0-9]+(-[a-z0-9]+)*" required>
      <p class="hint">Lowercase letters, digits, and single hyphens &mdash; e.g. <code>chrono-trigger</code>.</p>
    </div>

    <div class="field">
      <label for="title">Title</label>
      <input id="title" name="title" value="{{ title }}" maxlength="300" required>
    </div>

    <div class="field">
      <label for="body">Body</label>
      <textarea id="body" name="body">{{ body }}</textarea>
      <p class="hint">Plain text. Line breaks are preserved.</p>
    </div>

    <div class="actions">
      <button class="button--primary" type="submit">Create page</button>
      <a class="button" href="/">Cancel</a>
    </div>
  </form>
{% endblock %}
