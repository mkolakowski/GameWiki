[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gamewiki"
description = "A wiki for documenting information about games."
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.8",
]

# The version is read from app/version.py — the single source of truth.
# Never hardcode it here. See CLAUDE.md.
[tool.hatch.version]
path = "app/version.py"
pattern = '^APP_VERSION = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
