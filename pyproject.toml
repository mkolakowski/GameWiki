[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gamewiki"
description = "A wiki for documenting information about games."
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "authlib>=1.3",
    "fastapi>=0.115",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "nh3>=0.2.18",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

# The version is read from app/version.py — the single source of truth.
# Never hardcode it here. See CLAUDE.md.
[tool.hatch.version]
path = "app/version.py"
pattern = '^APP_VERSION = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
